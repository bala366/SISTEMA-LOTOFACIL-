name: Compilar AutoFacil V5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Conferir estrutura
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/python/autofacil_engine.py
          test -f app/src/main/java/com/autofacil/app/MainActivity.java
          echo "Estrutura AutoFacil V5 OK"

      - name: Validar motor Python 3.11
        run: |
          python --version
          python -m py_compile app/src/main/python/autofacil_engine.py
          echo "Motor Python validado"

      - name: Compilar AutoFacil V5
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Conferir APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar AutoFacil V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFacil-V5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
